# =========================
# DATABASE
# =========================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.generate-ddl=false
spring.jpa.show-sql=true

# IMPORTANT CHANGE
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# =========================
# FILE UPLOAD
# =========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# MAIL CONFIGURATION
# =========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

mail.debug=false

# =========================
# GOOGLE LOGIN
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope[0]=email
spring.security.oauth2.client.registration.google.scope[1]=profile

# =========================
# FACEBOOK LOGIN
# =========================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope[0]=email
spring.security.oauth2.client.registration.facebook.scope[1]=public_profile

spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v10.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v10.0/me?fields=email,first_name,last_name,name

# =========================
# GITHUB LOGIN
# =========================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope[0]=user:email
spring.security.oauth2.client.registration.github.scope[1]=read:user

# =========================
# RECAPTCHA
# =========================
# suppress inspection "SpringBootApplicationProperties"
recaptcha.secret=${RECAPTCHA_SECRET}

# suppress inspection "SpringBootApplicationProperties"
recaptcha.url=https://www.google.com/recaptcha/api/siteverify?secret=%s&response=%s

# =========================
# HOST
# =========================
hostname=http://localhost:3000

# =========================
# JWT
# =========================
jwt.header=Authorization
jwt.secret=${JWT_SECRET}
jwt.expiration=604800

# =========================
# LOGGING
# =========================
logging.level.com.gmail.merikbest2015.ecommerce.controller=debug
logging.level.org.springframework.security=DEBUG
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# =========================
# UPLOADS
# =========================
upload.path=D:/ecommerce-perfume/uploads/

spring.config.import=optional:file:.env[.properties]
